# Standalone-Vorlage: nur Crawler + eigene DB (+ optional ES/Kibana). Empfohlen ist der Start ueber
# RookHubs Compose-Dateien (siehe CLAUDE.md); diese Datei wird in Prod/Dev NICHT benutzt.
# - Alle Ports nur an 127.0.0.1 gebunden: MariaDB, die Crawler-API und das ungeschuetzte ES/Kibana sind
#   so nicht aus dem Netz erreichbar, auch wenn die Datei auf einem Server mit oeffentlicher IP laeuft.
# - CRAWLER_API_KEY ist Pflicht (Compose bricht sonst ab); ohne echten Wert antwortet die API mit 503.
# - Elasticsearch + Kibana nur mit Profil: docker compose --profile logging up --build
#   (dazu CRAWLER_ES_URL=http://elasticsearch:9200 in der .env, sonst loggt der Crawler nur auf die Konsole).
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set a strong password in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chessresults}
      MYSQL_USER: ${MYSQL_USER:-chessresults}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set a strong password in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  gluetun:
    # Major-Version gepinnt: ein ungepinntes :latest zieht Watchtower nachts auch ueber einen Major-Sprung.
    image: qmcgaw/gluetun:v3
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:-airvpn}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-Germany}
      FIREWALL_VPN_INPUT_PORTS: ${FIREWALL_VPN_INPUT_PORTS:-8080}
    ports:
      - "127.0.0.1:8080:8080"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: crawler-elasticsearch
    profiles: ["logging"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=crawler-logs
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: crawler-kibana
    profiles: ["logging"]
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  app:
    build:
      context: ./src/ChessResultsCrawler
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      mariadb:
        condition: service_healthy
      gluetun:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=${MYSQL_DATABASE:-chessresults};User=${MYSQL_USER:-chessresults};Password=${MYSQL_PASSWORD:?set a strong password in .env};"
      ASPNETCORE_ENVIRONMENT: Production
      # Derselbe Wert wie RookHubs CRAWLER_API_KEY; der Platzhalter aus .env.example zaehlt wie keiner (503).
      API_KEY: ${CRAWLER_API_KEY:?set CRAWLER_API_KEY in .env (same value as RookHub)}
      # Leer = nur Konsolen-Log; mit Profil "logging": http://elasticsearch:9200
      Elasticsearch__Url: ${CRAWLER_ES_URL:-}

volumes:
  mariadb_data:
  es-data:
