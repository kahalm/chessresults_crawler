name: Build & Push Docker Image

on:
  push:
    branches: [main]          # -> :dev (Vorschau)
    # -> :latest + :x.y.z (Prod, tag-gated). Nur reine Release-Tags vX.Y.Z; ein Sicherungs-Tag
    # wie "vorher-umbau" oder "v-test" darf keinen Prod-Build auslösen.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

env:
  REGISTRY: ghcr.io

jobs:
  # Test-Gate: blockiert den Image-Push, bis die Crawler-Tests grün sind
  test:
    runs-on: ubuntu-latest
    # Der Test-Job braucht nur Lesezugriff — nicht den (ungeprüften) Repo-Default erben.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/ChessResultsCrawler.Tests --verbosity normal

  build-crawler:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # volle Historie: der Release-Guard prüft, ob der markierte Commit auf main liegt
          fetch-depth: 0

      # Release-Guard: ein Tag geht nur nach Prod (:latest), wenn er die Form vX.Y.Z hat UND der
      # markierte Commit auf main liegt. Sonst bricht der Job vor dem Push ab (Watchtower würde
      # :latest sonst um 02:00 mit einem ungemergten Branch-Stand ausrollen).
      - name: Release-Tag prüfen (vX.Y.Z und auf main)
        id: release
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' ist kein Release-Tag vX.Y.Z - kein Build."
            exit 1
          fi
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tag '$GITHUB_REF_NAME' liegt nicht auf main - kein Build."
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/kahalm/rookhub-crawler
          # :latest ausschließlich über den Release-Guard, nicht zusätzlich automatisch
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ steps.release.outputs.release == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/ChessResultsCrawler
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
